{% extends 'base.html' %}
{% block title %}Create Attendance Session{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card">
      <div class="card-header"><h5 class="fw-bold mb-0">New Attendance Session - {{ course.title }}</h5></div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Date</label>
            <input type="date" name="date" class="form-control" value="{% now 'Y-m-d' %}" required/>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Topic</label>
            <input type="text" name="topic" class="form-control" placeholder="For example: Introduction to Python"/>
          </div>
          <div class="mb-4 p-3 rounded-4" style="background: var(--sc-surface); border: 1px solid var(--sc-border);">
            <div class="form-check form-switch">
              <input type="checkbox" name="allow_self" class="form-check-input" id="allow_self"/>
              <label for="allow_self" class="form-check-label fw-semibold">Allow self-marking</label>
            </div>
            <div class="form-text">When enabled, students can mark themselves as present from their attendance page.</div>
          </div>
          <div class="d-flex flex-wrap gap-2">
            <button type="submit" class="btn btn-success">Create Session</button>
            <a href="{% url 'attendance_list' course.pk %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
