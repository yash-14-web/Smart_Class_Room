{% extends 'base.html' %}
{% block title %}Delete Recorded Class - SmartClass{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card border-danger">
      <div class="card-header bg-danger text-white"><h5 class="fw-bold mb-0">Delete Recorded Class</h5></div>
      <div class="card-body text-center py-5 px-4">
        <i class="bi bi-camera-video-off text-danger" style="font-size:3rem"></i>
        <p class="fs-5 mt-3 mb-2">Delete <strong>{{ recorded_class.title }}</strong>?</p>
        <p class="text-muted mb-4">This recording will be removed permanently and cannot be undone.</p>
        <form method="post" class="d-flex justify-content-center gap-2 flex-wrap">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Yes, Delete</button>
          <a href="{% url 'recorded_class_list' %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
