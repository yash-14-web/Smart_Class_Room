{% extends 'base.html' %}
{% block title %}Edit Report - {{ report.student.username }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card">
      <div class="card-header"><h5 class="mb-0">Edit Report Card</h5></div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <div class="d-flex flex-wrap gap-2"><button type="submit" class="btn btn-primary">Save Changes</button><a href="{% url 'report_detail' report.pk %}" class="btn btn-outline-secondary">Cancel</a></div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
